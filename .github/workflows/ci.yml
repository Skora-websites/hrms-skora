name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/hrms-ci?tls=false
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Seed test accounts
        run: node scripts/seed-test-accounts.js

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          nohup npm run start > .server.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 http://localhost:3000/api/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Production server is up and MongoDB reachable (health -> 200)"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to become healthy — log follows"
          tail -n 100 .server.log
          exit 1

      - name: Run tests
        run: npm test

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: .server.log
          retention-days: 7
